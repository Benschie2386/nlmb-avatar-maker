<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090611">
<link rel="manifest" href="manifest.webmanifest">
<title>NLMB Avatar Maker V2</title>
<style>
:root{--bg:#07050d;--panel:#0e0a17;--panel2:#120c1d;--line:#38205a;--text:#f5f0ff;--muted:#a99eb9;--accent:#b83cff;--accent2:#7b2cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#21103b 0,#090611 42%,#05040a 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid #2b1744;padding:24px 12px;background:#09060f}.logo{text-align:center;font-weight:900;font-size:27px;line-height:.8;margin:4px 0 30px;text-shadow:0 0 18px #d36bff}.logo small{display:block;font-size:11px;letter-spacing:4px;color:#c85bff;margin-top:10px}
.nav button{width:100%;border:1px solid transparent;background:transparent;color:#bcb2ca;text-align:left;padding:13px 14px;border-radius:10px;font-size:16px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{border-color:#b23cff;background:#170d24;color:#fff;box-shadow:0 0 18px #5e1b8d55}
.main{padding:18px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.eyebrow{color:#c85bff;letter-spacing:4px;font-weight:800;font-size:11px}.top h1{margin:5px 0 0;font-size:28px}.status{border:1px solid #205d43;background:#09170f;color:#63ffbd;padding:8px 13px;border-radius:10px;font-size:12px}
.grid{display:grid;grid-template-columns:minmax(450px,1.25fr) minmax(360px,.9fr);gap:14px}.card{background:linear-gradient(180deg,#100b18,#090711);border:1px solid #39205a;border-radius:16px;overflow:hidden}.cardhead{padding:14px 16px;border-bottom:1px solid #322044;display:flex;justify-content:space-between;font-weight:800}.preview{height:675px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#1a1028,#090711 57%)}.floor{position:absolute;bottom:-120px;width:75%;height:300px;border:2px solid #6e28bb;border-radius:50%;box-shadow:0 0 35px #8d2cff44}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 35px,#5e24a033 36px 37px),repeating-linear-gradient(0deg,transparent 0 35px,#5e24a033 36px 37px);border-radius:50%;opacity:.7}
.avatar{position:relative;width:250px;height:500px;z-index:2;filter:drop-shadow(0 20px 25px #000)}.head{position:absolute;left:58px;top:32px;width:134px;height:134px;background:#d99a69;border-radius:30px;z-index:4;box-shadow:inset 0 -8px 0 #a86c4d}.hair{position:absolute;left:50px;top:20px;width:150px;height:80px;background:#15151d;border-radius:55px 55px 25px 25px;z-index:7;box-shadow:0 0 18px #000}.hair:after{content:"";position:absolute;left:12px;bottom:-12px;width:35px;height:55px;background:inherit;border-radius:0 0 18px 18px}.eyes{position:absolute;left:84px;top:88px;display:flex;gap:34px;z-index:8}.eye{width:18px;height:9px;border-radius:50%;background:#c03cff;box-shadow:0 0 7px currentColor,0 0 22px currentColor}.body{position:absolute;left:54px;top:154px;width:142px;height:175px;border-radius:20px;background:#171a24;border:2px solid #262a36;z-index:3}.logoText{position:absolute;left:0;right:0;top:68px;text-align:center;font-weight:900;color:#c344ff;text-shadow:0 0 12px #c344ff;font-size:20px}.arm{position:absolute;top:165px;width:42px;height:142px;border-radius:24px;background:#151a25;border:2px solid #2a3040;z-index:2}.arm.l{left:20px}.arm.r{right:20px}.hand{position:absolute;top:294px;width:38px;height:45px;border-radius:15px;background:#d99a69;z-index:3}.hand.l{left:23px}.hand.r{right:23px}.leg{position:absolute;top:319px;width:57px;height:145px;background:#151a25;border:2px solid #252a38;border-radius:0 0 16px 16px}.leg.l{left:55px}.leg.r{right:55px}.shoe{position:absolute;top:447px;width:70px;height:35px;background:#25135e;border:2px solid #7936e8;border-radius:9px;box-shadow:0 0 15px #7131e866}.shoe.l{left:45px}.shoe.r{right:45px}
.mask{position:absolute;left:60px;top:82px;width:130px;height:65px;background:#090a11;border-radius:18px;z-index:9;border:2px solid #292536}.crown{position:absolute;left:65px;top:0;width:120px;height:48px;background:#d9a928;clip-path:polygon(0 100%,10% 20%,35% 55%,50% 0,65% 55%,90% 20%,100% 100%);z-index:10;filter:drop-shadow(0 0 9px #ffd84c)}.wings{position:absolute;top:170px;left:-55px;width:360px;height:130px;z-index:1}.wings:before,.wings:after{content:"";position:absolute;top:0;width:150px;height:120px;background:linear-gradient(135deg,#a63cff,#35105f);clip-path:polygon(100% 0,0 55%,90% 100%,72% 55%)}.wings:before{left:0}.wings:after{right:0;transform:scaleX(-1)}.aura{position:absolute;left:25px;top:80px;width:200px;height:360px;border-radius:50%;border:2px solid #b33cff88;box-shadow:0 0 30px #b33cff66,0 0 80px #6e2cff33;z-index:0}
.controls{padding:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}.tabs button,.choice{border:1px solid #3c205d;background:#0a0710;color:#cfc5da;border-radius:9px;padding:9px;cursor:pointer}.tabs button.active,.choice.active{background:#25103a;border-color:#b83cff;color:#fff;box-shadow:0 0 12px #a72cff33}.section{margin:13px 0}.section h3{font-size:13px;margin:0 0 8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choices .choice{min-height:42px;font-size:12px}.row{display:flex;gap:8px}.row button{flex:1}.primary{background:linear-gradient(90deg,#8d27f3,#c43cff)!important;color:#fff!important;border-color:#c44bff!important;font-weight:800}.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid #3c205d;padding:10px;border-radius:9px;background:#0a0710}.toggle input{accent-color:#b83cff;transform:scale(1.2)}input[type=range]{width:100%;accent-color:#b83cff}.saved{margin-top:10px;border-top:1px solid #2e1b44;padding-top:10px}.saveditem{display:flex;justify-content:space-between;align-items:center;border:1px solid #321d4b;border-radius:8px;padding:8px;margin-top:6px;font-size:12px}.saveditem button{background:none;border:0;color:#d36bff;cursor:pointer}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.preview{height:560px}.main{padding:10px}.top h1{font-size:22px}.choices{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">NLMB<small>AVATAR MAKER</small></div><div class="nav" id="nav"></div></aside>
<main class="main">
<div class="top"><div><div class="eyebrow">CREATE • CUSTOMIZE • BE UNIQUE</div><h1>NLMB Avatar Maker <span style="font-size:12px;color:#a879c8">V2</span></h1></div><div class="status">● Offline Ready</div></div>
<div class="grid">
<section class="card"><div class="cardhead"><span>Avatar Vorschau</span><span id="outfitName">Neues Outfit</span></div><div class="preview"><div class="floor"></div><div class="avatar" id="avatar"><div class="aura" id="aura"></div><div class="wings" id="wings"></div><div class="crown" id="crown"></div><div class="head" id="head"></div><div class="hair" id="hair"></div><div class="eyes" id="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mask" id="mask"></div><div class="arm l"></div><div class="arm r"></div><div class="hand l"></div><div class="hand r"></div><div class="body" id="body"><div class="logoText">NLMB</div></div><div class="leg l" id="legL"></div><div class="leg r" id="legR"></div><div class="shoe l"></div><div class="shoe r"></div></div></div></section>
<section class="card"><div class="cardhead"><span>CUSTOMIZATION</span><span id="catTitle">Körper</span></div><div class="controls"><div class="tabs" id="tabs"></div><div id="panel"></div><div class="row"><button class="choice" id="random">🎲 Zufälliger Avatar</button><button class="choice primary" id="save">💾 Outfit speichern</button></div><div class="saved" id="saved"></div></div></section>
</div></main></div>
<script>
const cats={Körper:"👤",Kleidung:"👕",Gesicht:"😎",Haare:"💇",Accessoires:"👑",Rücken:"🪽",Effekte:"✨"};
const state={skin:"#d99a69",body:"Classic",hair:"Shadow",hairColor:"#15151d",eyes:true,eyeColor:"#c03cff",mask:true,crown:false,wings:true,aura:true,outfit:"NLMB Black",shirt:"#171a24",pants:"#151a25",wingColor:"#a63cff",effect:"Neon"};
let cat="Körper";
const $=id=>document.getElementById(id);
function renderNav(){nav.innerHTML=Object.entries(cats).map(([k,v])=>`<button class="${k===cat?'active':''}" onclick="setCat('${k}')">${v} ${k}</button>`).join("")}
function setCat(c){cat=c;catTitle.textContent=c;renderNav();renderPanel()}
function choices(arr, key, labels=arr){return `<div class="choices">${arr.map((x,i)=>`<button class="choice ${state[key]===x?'active':''}" onclick="setVal('${key}',${JSON.stringify(x)})">${labels[i]}</button>`).join("")}</div>`}
function toggle(key,label){return `<label class="toggle"><span>${label}</span><input type="checkbox" ${state[key]?'checked':''} onchange="setVal('${key}',this.checked)"></label>`}
function renderPanel(){
 let h="";
 if(cat==="Körper") h=`<div class="section"><h3>Hautfarbe</h3>${choices(["#b9784d","#d99a69","#efb083","#9d603f","#f2c39d"],"skin",["Tan","Classic","Light","Dark","Pale"])}</div><div class="section"><h3>Körper-Preset</h3>${choices(["Classic","Athletic","Slim","Heavy"],"body)}</div>`;
 if(cat==="Haare") h=`<div class="section"><h3>Frisur</h3>${choices(["Shadow","Crown Cut","Spikes","Long"],"hair)}</div><div class="section"><h3>Haarfarbe</h3>${choices(["#15151d","#5a22a8","#e7e7f2","#d22cff","#101010"],"hairColor",["Black","Purple","White","Neon Purple","Dark"])}</div>`;
 if(cat==="Gesicht") h=`<div class="section"><h3>Augen</h3>${toggle("eyes","Leuchtende Augen")}</div><div class="section"><h3>Augenfarbe</h3>${choices(["#c03cff","#32a8ff","#ff304f","#43ff92","#ffffff"],"eyeColor",["Purple","Blue","Red","Green","White"])}</div><div class="section"><h3>Maske</h3>${toggle("mask","Maske aktiv")}</div>`;
 if(cat==="Kleidung") h=`<div class="section"><h3>Outfit</h3>${choices(["NLMB Black","NLMB Purple","Cyber White","Shadow"],"outfit)}</div><div class="section"><h3>Hose</h3>${choices(["#151a25","#32145e","#25252c"],"pants,")}</div>`;
 if(cat==="Accessoires") h=`<div class="section"><h3>Head Accessory</h3>${toggle("crown","NLMB Krone")}</div><div class="section"><h3>Weitere Styles</h3>${choices(["Gold","Purple","Dark"],"effect")}</div>`;
 if(cat==="Rücken") h=`<div class="section"><h3>Back Item</h3>${toggle("wings","Flügel aktiv")}</div><div class="section"><h3>Flügel-Farbe</h3>${choices(["#a63cff","#32a8ff","#ff315d","#e9e9ff"],"wingColor",["Purple","Blue","Red","White"])}</div>`;
 if(cat==="Effekte") h=`<div class="section"><h3>Aura</h3>${toggle("aura","Neon Aura")}</div><div class="section"><h3>Glow-Stärke</h3><input type="range" min="0" max="30" value="18" oninput="avatar.style.filter='drop-shadow(0 20px 25px #000) drop-shadow(0 0 '+this.value+'px #b83cff88)'"></div>`;
 panel.innerHTML=h; apply();
}
function setVal(k,v){ if(k==="pants,") return; state[k]=v; apply(); renderPanel() }
function apply(){
 head.style.background=state.skin; hair.style.background=state.hairColor; crown.style.display=state.crown?"block":"none"; mask.style.display=state.mask?"block":"none"; wings.style.display=state.wings?"block":"none"; aura.style.display=state.aura?"block":"none";
 eyes.style.display=state.eyes?"flex":"none"; eyes.querySelectorAll(".eye").forEach(e=>e.style.color=state.eyeColor);
 body.style.background=state.outfit==="NLMB Purple"?"#32145e":state.outfit==="Cyber White"?"#d7d7e2":state.outfit==="Shadow"?"#0d0e14":"#171a24";
 body.querySelector(".logoText").style.color=state.outfit==="Cyber White"?"#8d27f3":"#c344ff";
 wings.style.setProperty("--wc",state.wingColor); wings.querySelectorAll(":scope").forEach(()=>{}); wings.style.background=""; wings.style.filter=`hue-rotate(${state.wingColor==="#32a8ff"?100:state.wingColor==="#ff315d"?-45:state.wingColor==="#e9e9ff"?180:0}deg)`;
 outfitName.textContent=state.outfit;
}
function randomize(){
 const pick=(a)=>a[Math.floor(Math.random()*a.length)];
 Object.assign(state,{skin:pick(["#b9784d","#d99a69","#efb083","#9d603f","#f2c39d"]),body:pick(["Classic","Athletic","Slim","Heavy"]),hair:pick(["Shadow","Crown Cut","Spikes","Long"]),hairColor:pick(["#15151d","#5a22a8","#e7e7f2","#d22cff","#101010"]),eyeColor:pick(["#c03cff","#32a8ff","#ff304f","#43ff92","#ffffff"]),eyes:Math.random()>.15,mask:Math.random()>.35,crown:Math.random()>.6,wings:Math.random()>.25,aura:Math.random()>.3,outfit:pick(["NLMB Black","NLMB Purple","Cyber White","Shadow"]),wingColor:pick(["#a63cff","#32a8ff","#ff315d","#e9e9ff"])});
 apply();renderPanel()
}
function saveOutfit(){
 const arr=JSON.parse(localStorage.getItem("nlmbV2")||"[]"); arr.unshift({...state}); localStorage.setItem("nlmbV2",JSON.stringify(arr.slice(0,8))); renderSaved()
}
function loadOutfit(i){const a=JSON.parse(localStorage.getItem("nlmbV2")||"[]");Object.assign(state,a[i]);apply();renderPanel()}
function renderSaved(){const a=JSON.parse(localStorage.getItem("nlmbV2")||"[]");saved.innerHTML=a.length?`<b>Gespeicherte Outfits</b>`+a.map((x,i)=>`<div class="saveditem"><span>💾 ${x.outfit||"Outfit"} ${i+1}</span><button onclick="loadOutfit(${i})">Laden</button></div>`).join(""):""}
random.onclick=randomize;save.onclick=saveOutfit;renderNav();renderPanel();renderSaved();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
